[project]
name = "gsolve"
dynamic = ["version"] # version = "5.6.0"
description = "A Python package for processing gravity survey data."
requires-python = ">=3.12"
authors = [
    { name = "Adrian Benson" },
    { name = "Alison Kirkby" },
    { name = "Craig Miller" },
    { name = "Aleksandr Spesivtsev" },
    { name = "Vaughan Stagpoole" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "boule==0.6.*",
    "harmonica<0.8",
    "openpyxl>=3.1.5",
    "pandas[plot]<3",
    "pydata-sphinx-theme>=0.16.1",
    "pygtide>=0.9.1",
    "pyhardisp>=0.2.1",
    "rioxarray>=0.22.0",
    "tqdm>=4.67.3",
    "xarray>2025.12",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "pytest-datadir>=1.8.0", "ruff"]

[project.urls]
Repository = "https://github.com/GNS-Science/gsolve"
Documentation = "https://gns-science.github.io/gsolve/"
Issues = "https://github.com/GNS-Science/gsolve/issues"
Changelog = "https://github.com/GNS-Science/gsolve/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "5.X.X"

[dependency-groups]
docs = [
    "myst-parser>=5.0.0",
    "numpydoc>=1.10.0",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.0",
    "sphinx-book-theme>=1.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-gallery>=0.21.0",
]
dev = [
    "burocrata>=0.3.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pandas-vet>=2023.8.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-datadir>=1.8.0",
    "ruff",
]

[tool.uv]
required-version = ">=0.11.8"

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------
# Other tools configuration

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "-q", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = "./src"
cache_dir = ".cache/pytest_cache"

[tool.coverage.run]
branch = true
source = ["src/gsolve"]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"


[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["ANN", "D", "DOC", "PD", "NPY"]
preview = true
extend-select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "NPY",  # NumPy specific rules
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "RET",  # flake8-return
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    # "E501",
    "PLR0917",
]
ignore = [
    "ANN003",  # alloww unannotated **kwargs
    "D105",    # allow undoc magic methods
    "DOC501",  # don't NEED to document exceptions
    "D100",    # allow unocumented modules
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
    "RET504",  # Allow variable assignment only for return
    "PT001",   # Conventions for parenthesis on pytest.fixture
    "D200",    # Allow single line docstrings in their own line
    "B028",    # Allow no stacklevel in warnings.warn
    "UP040",   # Allow old style type alias - will fix later
    "PLR6104", # Don't prefer augmented assignment - breaks pandas
]

[tool.ruff.lint.per-file-ignores]
"examples/scripts/**" = [
    "D",    # Docs not required for scripts
    "DOC",  # ditto
    "T201", # Allow print() in scripts
]
"tests/**" = [
    "ANN001",  # type annotations not required for func args
    "ANN201",  # or public func return
    "ANN202",  # or private func return
    "D",       # Docstrings not required
    "DOC",     # Docstrings not required
    "PLR6301", # allow unused self in test classess
    "PLC2701", # permit import of private functions etc - we are need to test em
    "PT011",   # allow tests to catch exceptions without a 'match' arg
    "PT030",   # allow tests to catch warnings without a 'match' arg
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.burocrata]
notice = '''
# gSolve - gravity processing software.
# Copyright (c) 2026 Earth Sciences New Zealand.
# This program is free software: you can redistribute it and/or modify
# it under the terms of the GNU General Public License as published by
# the Free Software Foundation, either version 3 of the License, or
# (at your option) any later version.

# This program is distributed in the hope that it will be useful,
# but WITHOUT ANY WARRANTY; without even the implied warranty of
# MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
# GNU General Public License for more details.

# You should have received a copy of the GNU General Public License
# along with this program.  If not, see <https://www.gnu.org/licenses/>.
# SPDX-License-Identifier: GPLv3
'''
exclude = ["__init__.py"]


[tool.ty.src]
include = ["gsolve/", "examples/scripts/"]


[tool.numpydoc_validation]
checks = ["all", "EX01", "SA01"]
