[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", files = "\\.py$" },
    { id = "end-of-file-fixer", files = "\\.py$" },
    { id = "check-added-large-files" },
    { id = "check-case-conflict" },
    { id = "detect-private-key" },
    { id = "check-yaml" },
    { id = "check-toml" },
]

[[repos]]
repo = "local"
hooks = [
    # run lock check - fail if not synced
    { id = "uv-lock-check", name = "uv lock check", entry = "uv lock --check", language = "system", files = "^(pyproject\\.toml|uv\\.lock)$", pass_filenames = false },
    # Run the linter.
    { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --fix", language = "system", types = [
        "python",
    ] },
    # run formatter
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types = [
        "python",
    ] },
    # type checking
    { id = "ty", name = "ty check", entry = "uv run ty check", language = "system", types = [
        "python",
    ], pass_filenames = false },
]
