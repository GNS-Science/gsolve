name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
    
    - name: Install dependencies
      run: uv sync --all-groups --locked
    
    - name: Run tests
      run: uv run pytest tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    
    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
    
    - name: Build distribution
      run: uv build
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
